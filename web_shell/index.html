<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11201f">
<meta name="description" content="Print Shop Sim — first-person 3D print shop tycoon. Browser-first playable prototype.">
<title>Print Shop Sim</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; background: #11201f; color: #fff4db; font-family: system-ui, sans-serif; overflow: hidden; }
body { display: grid; place-items: center; }
#frame { position: relative; height: 100vh; height: 100dvh; width: 100vw; }
#canvas { display: block; width: 100%; height: 100%; border: 0; outline: none; touch-action: none; }
#loading { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: clamp(24px, 8vw, 100px); background: linear-gradient(120deg, #11201f, #294941); }
h1 { font-size: clamp(28px, 7vw, 52px); margin: 0 0 8px; color: #f5b766; letter-spacing: -1.5px; }
p { line-height: 1.5; }
progress { width: 100%; accent-color: #f5b766; margin-top: 20px; }
#notice { color: #f5b766; white-space: pre-wrap; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<main id="frame" aria-label="Print Shop Sim game">
<canvas id="canvas" tabindex="0" aria-label="Print Shop Sim. Click to play. WASD to move, mouse to look, E to interact."></canvas>
<section id="loading" aria-live="polite">
<h1>Print Shop Sim</h1>
<progress id="progress" aria-label="Downloading game"></progress>
<p id="notice">Loading the browser engine. First load may take a moment.</p>
<noscript>JavaScript and WebGL 2 are required to play.</noscript>
</section>
</main>

<script src="$GODOT_URL"></script>
<script>
const config = $GODOT_CONFIG;
const canvas = document.getElementById('canvas');
const notice = document.getElementById('notice');
function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
const engine = new Engine(config);
const missing = Engine.getMissingFeatures({threads: false});
window.printshopLoadError = null;
function failure(error) {
  const message = error instanceof Error ? error.message : String(error);
  window.printshopLoadError = message;
  notice.textContent = 'Unable to start: ' + message + '\nTry a current browser with WebGL 2 enabled.';
  document.getElementById('progress').hidden = true;
  console.error(error);
}
if (missing.length) {
  failure('Missing browser features: ' + missing.join(', '));
} else {
  engine.startGame({
    onProgress: function (current, total) {
      const bar = document.getElementById('progress');
      if (total > 0) bar.value = current / total;
    },
  }).then(function () {
    const loading = document.getElementById('loading');
    if (loading) loading.remove();
    canvas.focus();
  }).catch(failure);
}
</script>
</body>
</html>
