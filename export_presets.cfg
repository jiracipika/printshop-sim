[preset.1]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Keep build artifacts, docs and test tooling out of the APK (mirrors the
; Web preset's exclusions; web/ is built web output, not needed on device).
; NOTE: Godot's ConfigFile only honors ";" comments — "#" lines silently
; break parsing of the REST of their section (the old "#" comments here were
; why exclude_filter was reported missing on every import).
exclude_filter="docs/*,tests/*,tools/*,web/*,design/*,artifacts/*,.baseline_logs/*"
export_path="builds/printshop-sim.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
; min_sdk/target_sdk stay empty: they are ONLY honored with gradle builds,
; and this preset uses the prebuilt export templates (use_gradle_build=false).
; The template manifest pins the real minSdk (checked via aapt: 24).
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
; x86_64 is REQUIRED for emulator testing: Android emulators are x86_64
; images, and an arm64-only APK runs under the ARM translator, whose JIT
; segfaults (SIGSEGV SEGV_ACCERR in /memfd:child — verified 2026-09-29).
; Real devices use arm64-v8a; x86_64 adds ~30 MB to the APK.
architectures/x86_64=true
version/code=1
version/name="0.62.0"
package/unique_name="com.jiracipika.printshopsim"
package/name="Print Shop Sim"
; Debug signing wired into the preset: export produces a SIGNED APK directly
; (v1+v2+v3) using the repo-committed android/debug.keystore — no manual
; zipalign + apksigner pass needed. The key is DEBUG-ONLY; never ship it to a
; store (release builds need a separate, non-committed release keystore).
keystore/debug="res://android/debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=false
package/show_as_launcher_app=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()
